name: Renovate

# Self-hosted Renovate for every repo of the joris-gallot account. Do not also enable the Mend
# Renovate app on these repos: both would push to the same `renovate/*` branches.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      repository:
        description: Only run on this repo (name without owner); empty runs on every repo
        default: ''
        type: string
      logLevel:
        description: Renovate log level
        default: info
        type: choice
        options: [info, debug]
      dryRun:
        description: Look up updates without opening or changing pull requests
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # Without `repositories`, the token covers every repo the app is installed on.
      - name: Get the app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RENOVATE_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Resolve the bot git author
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          echo "author=${SLUG}[bot] <${id}+${SLUG}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"

      - name: Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
        # Renovate ignores empty env vars, so unset inputs fall back to its defaults.
        env:
          RENOVATE_AUTODISCOVER: ${{ inputs.repository && 'false' || 'true' }}
          RENOVATE_AUTODISCOVER_FILTER: ${{ github.repository_owner }}/*
          RENOVATE_REPOSITORIES: ${{ inputs.repository && format('{0}/{1}', github.repository_owner, inputs.repository) || '' }}
          # Opt-in: only repos with a Renovate config are processed, and no onboarding PR is ever opened.
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          # Commits signed as the app's bot user, and made through the API so GitHub verifies them.
          RENOVATE_GIT_AUTHOR: ${{ steps.bot.outputs.author }}
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_DRY_RUN: ${{ inputs.dryRun && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
